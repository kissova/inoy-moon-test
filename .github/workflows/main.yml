name: Build Tweak Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Əl ilə işə salmaq üçün

jobs:
  build:
    name: Compile Dylib
    runs-on: ubuntu-latest

    env:
      THEOS: /opt/theos

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make git curl xz-utils unzip zstd file python3 perl rsync zip tar fakeroot dpkg ca-certificates jq build-essential clang lld llvm

    - name: Setup Theos
      run: |
        if [ ! -d "$THEOS/makefiles" ]; then
          sudo git clone --recursive https://github.com/theos/theos.git "$THEOS"
        fi
        
        sudo mkdir -p "$THEOS/sdks"
        if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
          curl -fSL "https://github.com/theos/sdks/archive/refs/heads/master.zip" -o /tmp/theos_sdks.zip || true
          if [ -s /tmp/theos_sdks.zip ]; then
            unzip -q /tmp/theos_sdks.zip -d /tmp/theos_sdks_ext
            SDK_DIR=$(find /tmp/theos_sdks_ext -maxdepth 3 -type d -name "iPhoneOS*.sdk" | sort -V | tail -n 1 || true)
            if [ -n "$SDK_DIR" ]; then
              sudo cp -r "$SDK_DIR" "$THEOS/sdks/"
            fi
          fi
          rm -rf /tmp/theos_sdks.zip /tmp/theos_sdks_ext
        fi
        ls -la "$THEOS/sdks"

    - name: Setup Toolchain & Linker
      run: |
        mkdir -p "$THEOS/toolchain/linux/iphone/bin"
        
        CLANG_BIN=$(find /usr/bin -name 'clang-[0-9]*' -type f -executable 2>/dev/null | sort -V | tail -n 1 || true)
        [ -z "$CLANG_BIN" ] && CLANG_BIN=$(command -v clang || true)
        CLANGXX_BIN=$(find /usr/bin -name 'clang++-[0-9]*' -type f -executable 2>/dev/null | sort -V | tail -n 1 || true)
        [ -z "$CLANGXX_BIN" ] && CLANGXX_BIN=$(command -v clang++ || true)
        
        sudo ln -sf "$CLANG_BIN" "$THEOS/toolchain/linux/iphone/bin/clang"
        sudo ln -sf "$CLANGXX_BIN" "$THEOS/toolchain/linux/iphone/bin/clang++"
        sudo ln -sf "$CLANG_BIN" /usr/local/bin/clang
        sudo ln -sf "$CLANGXX_BIN" /usr/local/bin/clang++
        
        LD64_BIN=$(find /usr/bin /usr/lib -name 'ld64.lld*' -type f -executable 2>/dev/null | sort -V | tail -n 1 || true)
        LLD_BIN=$(find /usr/bin /usr/lib -name 'lld*' -type f -executable 2>/dev/null | grep -v 'ld64' | sort -V | tail -n 1 || true)
        
        if [ -n "$LD64_BIN" ]; then
          RESOLVED_LD="$LD64_BIN"
          NEED_DARWIN_FLAVOR="0"
        elif [ -n "$LLD_BIN" ]; then
          RESOLVED_LD="$LLD_BIN"
          NEED_DARWIN_FLAVOR="1"
        else
          echo "XETA: ld64.lld ve ya lld tapilmadi."
          exit 1
        fi
        
        LD_WRAPPER="$THEOS/toolchain/linux/iphone/bin/ld"
        sudo rm -f "$LD_WRAPPER"
        {
          echo '#!/usr/bin/env bash'
          echo 'ARGS=()'
          echo 'HAS_PLAT=0'
          echo 'MIN_VER="14.0"'
          echo 'SDK_VER="16.5"'
          echo 'while [ $# -gt 0 ]; do'
          echo '  case "$1" in'
          echo '    -platform_version) HAS_PLAT=1; ARGS+=("$1") ;;'
          echo '    -iphoneos_version_min) shift; [ $# -gt 0 ] && MIN_VER="$1" ;;'
          echo '    -sdk_version) shift; [ $# -gt 0 ] && SDK_VER="$1" ;;'
          echo '    *) ARGS+=("$1") ;;'
          echo '  esac'
          echo '  shift'
          echo 'done'
          echo 'if [ "$HAS_PLAT" -eq 0 ]; then'
          echo '  ARGS+=(-platform_version ios "$MIN_VER" "$SDK_VER")'
          echo 'fi'
          if [ "$NEED_DARWIN_FLAVOR" = "1" ]; then
            echo "exec \"$RESOLVED_LD\" -flavor darwin \"\${ARGS[@]}\""
          else
            echo "exec \"$RESOLVED_LD\" \"\${ARGS[@]}\""
          fi
        } | sudo tee "$LD_WRAPPER" >/dev/null
        sudo chmod +x "$LD_WRAPPER"
        
        STRIP_BIN=$(find /usr/bin /usr/lib /usr/lib/llvm* -name 'llvm-strip*' -type f -executable 2>/dev/null | sort -V | tail -n 1 || true)
        if [ -n "$STRIP_BIN" ]; then
          sudo ln -sf "$STRIP_BIN" "$THEOS/toolchain/linux/iphone/bin/strip"
          sudo ln -sf "$STRIP_BIN" "/usr/local/bin/strip"
        fi

    - name: Install ldid
      run: |
        sudo apt-get install -y libssl-dev libplist-dev
        git clone https://github.com/ProcursusTeam/ldid.git /tmp/ldid
        cd /tmp/ldid
        git submodule update --init
        make CXXFLAGS="-std=c++17 -include cstdint"
        sudo cp ./ldid /usr/local/bin/ldid
        sudo cp ./ldid "$THEOS/toolchain/linux/iphone/bin/ldid" || true

    - name: Build Tweak
      run: |
        export PATH="$THEOS/toolchain/linux/iphone/bin:/usr/local/bin:$PATH"
        make clean
        make package FINALPACKAGE=1 || make

    - name: Collect Outputs
      run: |
        mkdir -p compiled_output
        find . -maxdepth 4 -type f \( -name "*.deb" -o -name "*.dylib" \) ! -path "./compiled_output/*" -exec cp -v {} compiled_output/ \;
        ls -lh compiled_output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tweak-Compiled-Output
        path: compiled_output/
